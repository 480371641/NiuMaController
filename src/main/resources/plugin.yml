name: NiuMaManager
version: '4.1'
main: mainFesht3.niuMaManager.NiuMaManager
api-version: '1.20'

permissions:
  NiuMaManager.user:
    description: 基础用户权限组
    default: true
#    children:
#      NiuMaManager.randomtp: true  # 子权限继承


commands:
  randomtp:
    description: 随机tp
    usage: /randomtp [help/do]
    permission: NiuMaManager.user
    permission-message: 你没有使用此指令的权限

  nmb:
    description: 获取牛马币数据
    usage: /nmb [bind/shop]
    permission: NiuMaManager.user
    permission-message: 你没有使用此指令的权限

  shop:
    description: 获取牛马商店ui
    usage: /shop [1/2/3]
    permission: NiuMaManager.user
    permission-message: 你没有使用此指令的权限

  exui:
    description: 获取牛马回收商店ui
    usage: /exui [1/2/3]
    permission: NiuMaManager.user
    permission-message: 你没有使用此指令的权限

  zs:
    description: 自杀
    usage: /zs
    permission: NiuMaManager.user
    permission-message: 你没有使用此指令的权限

  test:
    description: 测试
    usage: /test
    permission: NiuMaManager.test
    permission-message: 你没有使用此指令的权限
